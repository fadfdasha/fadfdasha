# فضفضة عشوائية — إعداد النشر على Fly.io
app = "fadfdasha"
primary_region = "fra"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[mounts]
  source = "chat_data"
  destination = "/data"

[env]
  DATA_DIR = "/data"
  NODE_ENV = "production"
  PORT = "3000"
  SITE_URL = "https://fadfdasha.fly.dev"
