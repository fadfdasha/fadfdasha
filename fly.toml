# fly.toml app configuration file generated for fadfdasha on 2026-09-26T11:13:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fadfdasha'
primary_region = 'fra'

[build]

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '3000'
  SITE_URL = 'https://fadfdasha.fly.dev'

[[mounts]]
  source = 'chat_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
