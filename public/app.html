<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_NAME}} — الدردشة</title>
<meta name="description" content="{{TAGLINE}}">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="side-header">
      <span class="logo">💬 {{SITE_NAME}}</span>
      <div class="user-row">
        <span id="userName" class="username"></span>
        <button id="logoutBtn" class="btn small ghost">خروج</button>
      </div>
    </div>
    <button id="randomBtn" class="btn primary big full">🎲 ابدأ دردشة عشوائية</button>
    <h3 class="side-title">محادثاتك</h3>
    <div id="convList" class="conv-list"></div>
  </aside>

  <main class="main">
    <section id="view-home" class="view">
      <div class="home-hero">
        <div class="big-emoji">💬</div>
        <h2>جاهز للفضفضة؟</h2>
        <p class="muted">اضغط الزر وخلّنا نوصلك بشخص غريب عشوائي —<br>تحدث معه بخصوصية تامة.</p>
        <button id="randomBtn2" class="btn primary big">🎲 ابدأ دردشة عشوائية</button>
      </div>
    </section>

    <section id="view-waiting" class="view hidden">
      <div class="home-hero">
        <div class="spinner"></div>
        <h2>بانتظار شخص عشوائي…</h2>
        <p class="muted">نبحث لك الآن عن شخص متصل — أول ما نلقاه نفتح المحادثة فورًا.</p>
        <button id="cancelWaitBtn" class="btn ghost">إلغاء الانتظار</button>
      </div>
    </section>

    <section id="view-chat" class="view hidden">
      <header class="chat-header">
        <button id="backBtn" class="btn small ghost">المحادثات</button>
        <span id="peerDot" class="dot offline"></span>
        <span id="peerName" class="peer-name"></span>
        <span id="peerStatus" class="muted small"></span>
        <div class="spacer"></div>
        <button id="nextBtn" class="btn small primary">⏭ التالي</button>
        <button id="blockBtn" class="btn small danger">حظر</button>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="sendForm" class="send-row">
        <input id="msgInput" type="text" maxlength="2000" placeholder="اكتب رسالتك…" autocomplete="off">
        <button class="btn primary" type="submit">إرسال</button>
      </form>
    </section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/app.js"></script>
</body>
</html>
